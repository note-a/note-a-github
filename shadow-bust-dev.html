<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>SHADOW BUST — DEV</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #00ff00;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 20px;
      min-height: 100vh;
    }
    h1 { font-size: 9px; color: #00ff00; letter-spacing: 2px; margin-bottom: 8px; }
    .row { display: flex; gap: 48px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
    .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .label { font-size: 7px; color: #00ff00; letter-spacing: 1px; }
    .sublabel { font-size: 5px; color: rgba(0,255,0,0.3); letter-spacing: 0.5px; }
    canvas {
      border-top: 2px solid #80ff80;
      border-left: 2px solid #80ff80;
      border-bottom: 2px solid #003300;
      border-right: 2px solid #003300;
      box-shadow: 0 0 14px rgba(0,255,0,0.4), 0 0 32px rgba(0,255,0,0.12);
    }
  </style>
</head>
<body>
<h1>▶ SHADOW BUST — DEVELOPMENT</h1>
<div class="row">

  <div class="col">
    <div class="label">A. DETAIL ENHANCED</div>
    <div class="sublabel">face anatomy · hair · ears · collar</div>
    <canvas id="cA" width="220" height="140"></canvas>
  </div>

  <div class="col">
    <div class="label">C. LIGHTING EFFECT</div>
    <div class="sublabel">directional light · rim · specular</div>
    <canvas id="cC" width="220" height="140"></canvas>
  </div>

</div>
<script>
setTimeout(() => {

// ════════════════════════════════════════════════════════
// A. DETAIL ENHANCED
// ════════════════════════════════════════════════════════
(function(){
  const c = document.getElementById('cA');
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const cx = W / 2, headY = 54;
  let tick = 0;

  const particles = Array.from({length: 52}, () => ({
    r:   34 + Math.random() * 44,
    a:   Math.random() * Math.PI * 2,
    spd: (Math.random() - 0.5) * 0.014,
    sz:  0.6 + Math.random() * 1.5,
    lf:  Math.random(),
  }));

  function headPath(hx, hy) {
    ctx.beginPath();
    ctx.moveTo(hx, hy + 42);
    ctx.bezierCurveTo(hx - 24, hy + 36, hx - 30, hy + 14, hx - 27, hy - 6);
    ctx.bezierCurveTo(hx - 25, hy - 22, hx - 16, hy - 34, hx - 10, hy - 38);
    ctx.bezierCurveTo(hx -  4, hy - 41, hx +  4, hy - 41, hx + 10, hy - 38);
    ctx.bezierCurveTo(hx + 16, hy - 34, hx + 25, hy - 22, hx + 27, hy - 6);
    ctx.bezierCurveTo(hx + 30, hy + 14, hx + 24, hy + 36, hx, hy + 42);
    ctx.closePath();
  }

  function draw() {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, 0, W, H);

    const pulse = 0.92 + Math.sin(tick * 0.03) * 0.08;
    const hx = cx, hy = headY;

    // particles
    particles.forEach(p => {
      p.a  += p.spd;
      p.lf  = (p.lf + 0.008) % 1;
      const px = hx + Math.cos(p.a) * p.r;
      const py = hy + Math.sin(p.a) * p.r * 0.52;
      const al = Math.sin(p.lf * Math.PI) * 0.65;
      ctx.save();
      ctx.shadowColor = '#00ff00'; ctx.shadowBlur = 3;
      ctx.fillStyle = `rgba(0,255,80,${al})`;
      ctx.beginPath(); ctx.arc(px, py, p.sz, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    });

    ctx.save();
    ctx.shadowColor = '#00ff00';

    // — HAIR —
    ctx.shadowBlur = 10 * pulse;
    ctx.fillStyle = 'rgba(0,36,0,1)';
    ctx.beginPath();
    ctx.moveTo(hx - 24, hy - 12);
    ctx.bezierCurveTo(hx - 29, hy - 40, hx - 15, hy - 58, hx,       hy - 61);
    ctx.bezierCurveTo(hx + 15, hy - 58, hx + 29, hy - 40, hx + 24,  hy - 12);
    ctx.bezierCurveTo(hx + 18, hy - 38, hx +  6, hy - 47, hx,       hy - 47);
    ctx.bezierCurveTo(hx -  6, hy - 47, hx - 18, hy - 38, hx - 24,  hy - 12);
    ctx.closePath();
    ctx.fill();

    // — FACE BASE —
    ctx.shadowBlur = 14 * pulse;
    ctx.fillStyle = 'rgba(0,60,0,0.97)';
    headPath(hx, hy);
    ctx.fill();

    // — EARS —
    ctx.shadowBlur = 6;
    ctx.fillStyle = 'rgba(0,52,0,0.92)';
    ctx.beginPath(); ctx.ellipse(hx - 28, hy + 4, 4, 7, -0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hx + 28, hy + 4, 4, 7,  0.15, 0, Math.PI*2); ctx.fill();
    // ear canal hint
    ctx.strokeStyle = 'rgba(0,200,50,0.25)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.arc(hx - 28, hy + 4, 2, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx + 28, hy + 4, 2, 0, Math.PI*2); ctx.stroke();

    // — FACE OUTLINE —
    ctx.shadowBlur = 7;
    ctx.strokeStyle = `rgba(0,255,0,${0.42 * pulse})`;
    ctx.lineWidth = 1.2;
    headPath(hx, hy);
    ctx.stroke();

    // — EYEBROWS —
    ctx.shadowBlur = 5;
    ctx.strokeStyle = `rgba(0,230,60,${0.68 + Math.sin(tick * 0.04) * 0.06})`;
    ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hx - 20, hy - 17);
    ctx.quadraticCurveTo(hx - 13, hy - 22, hx - 5, hy - 18);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(hx + 5, hy - 18);
    ctx.quadraticCurveTo(hx + 13, hy - 22, hx + 20, hy - 17);
    ctx.stroke();

    // — EYES —
    ctx.shadowBlur = 12;
    ctx.fillStyle = `rgba(0,255,80,${0.9 + Math.sin(tick * 0.03) * 0.06})`;
    ctx.beginPath(); ctx.ellipse(hx - 12, hy - 9, 5.5, 4,   0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hx + 12, hy - 9, 5.5, 4,   0, 0, Math.PI*2); ctx.fill();
    // pupil
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0,40,0,0.9)';
    ctx.beginPath(); ctx.ellipse(hx - 12, hy - 9, 2.5, 2.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hx + 12, hy - 9, 2.5, 2.5, 0, 0, Math.PI*2); ctx.fill();
    // highlight
    ctx.fillStyle = 'rgba(180,255,200,0.75)';
    ctx.beginPath(); ctx.ellipse(hx - 10, hy - 11, 1.8, 1.2,  0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hx + 14, hy - 11, 1.8, 1.2, -0.3, 0, Math.PI*2); ctx.fill();

    // — NOSE —
    ctx.shadowBlur = 3;
    ctx.strokeStyle = 'rgba(0,200,50,0.32)';
    ctx.lineWidth = 1; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hx - 1, hy - 2);
    ctx.lineTo(hx - 4, hy + 8);
    ctx.bezierCurveTo(hx - 4, hy + 12, hx + 4, hy + 12, hx + 4, hy + 8);
    ctx.lineTo(hx + 1, hy - 2);
    ctx.stroke();
    // nostrils
    ctx.fillStyle = 'rgba(0,180,40,0.3)';
    ctx.beginPath(); ctx.ellipse(hx - 5, hy + 12, 1.8, 1.2, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hx + 5, hy + 12, 1.8, 1.2,  0.3, 0, Math.PI*2); ctx.fill();

    // — MOUTH —
    ctx.shadowBlur = 5;
    ctx.strokeStyle = `rgba(0,210,55,${0.52 + Math.sin(tick * 0.025) * 0.08})`;
    ctx.lineWidth = 1.4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hx - 10, hy + 22);
    ctx.quadraticCurveTo(hx, hy + 25, hx + 10, hy + 22);
    ctx.stroke();
    // philtrum hint
    ctx.strokeStyle = 'rgba(0,180,45,0.2)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(hx - 1, hy + 14); ctx.lineTo(hx - 1, hy + 20);
    ctx.moveTo(hx + 1, hy + 14); ctx.lineTo(hx + 1, hy + 20);
    ctx.stroke();

    // — NECK —
    ctx.shadowBlur = 6;
    ctx.fillStyle = 'rgba(0,48,0,0.93)';
    ctx.beginPath();
    ctx.moveTo(hx - 9,  hy + 43);
    ctx.lineTo(hx + 9,  hy + 43);
    ctx.bezierCurveTo(hx + 11, hy + 52, hx + 12, hy + 58, hx + 13, hy + 62);
    ctx.lineTo(hx - 13, hy + 62);
    ctx.bezierCurveTo(hx - 12, hy + 58, hx - 11, hy + 52, hx - 9, hy + 43);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,255,0,0.28)'; ctx.lineWidth = 0.8;
    ctx.stroke();

    // — SHOULDERS —
    ctx.shadowBlur = 12 * pulse;
    ctx.fillStyle = 'rgba(0,45,0,0.95)';
    ctx.beginPath();
    ctx.moveTo(hx - 13, hy + 62); ctx.lineTo(hx + 13, hy + 62);
    ctx.lineTo(hx + 78, H + 2);   ctx.lineTo(hx - 78, H + 2);
    ctx.closePath(); ctx.fill();

    ctx.shadowBlur = 9;
    ctx.strokeStyle = `rgba(0,255,0,${0.48 * pulse})`; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(hx - 13, hy + 62);
    ctx.bezierCurveTo(hx - 36, hy + 66, hx - 60, hy + 78, hx - 78, H + 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(hx + 13, hy + 62);
    ctx.bezierCurveTo(hx + 36, hy + 66, hx + 60, hy + 78, hx + 78, H + 2);
    ctx.stroke();

    // collar V-line
    ctx.shadowBlur = 4;
    ctx.strokeStyle = 'rgba(0,200,50,0.28)'; ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(hx - 14, hy + 64);
    ctx.quadraticCurveTo(hx, hy + 72, hx + 14, hy + 64);
    ctx.stroke();

    ctx.restore();

    // scanlines
    ctx.fillStyle = 'rgba(0,0,0,0.09)';
    for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);

    // scan sweep
    const sy = (tick * 1.6) % (H + 10) - 5;
    const sg = ctx.createLinearGradient(0, sy - 6, 0, sy + 6);
    sg.addColorStop(0,   'rgba(0,255,0,0)');
    sg.addColorStop(0.5, 'rgba(0,255,0,0.1)');
    sg.addColorStop(1,   'rgba(0,255,0,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, sy - 6, W, 12);

    // corner brackets
    const bk = 9;
    ctx.strokeStyle = 'rgba(0,255,0,0.55)'; ctx.lineWidth = 1.5;
    [[0,0,1,1],[W,0,-1,1],[0,H,1,-1],[W,H,-1,-1]].forEach(([x,y,sx,sy2]) => {
      ctx.beginPath();
      ctx.moveTo(x + sx*bk, y); ctx.lineTo(x, y); ctx.lineTo(x, y + sy2*bk);
      ctx.stroke();
    });

    ctx.font = "5px 'Press Start 2P',monospace";
    ctx.fillStyle = tick % 28 < 18 ? 'rgba(0,255,0,0.45)' : 'rgba(0,255,0,0.1)';
    ctx.textAlign = 'left';  ctx.fillText('ID-DETAIL', 5, H - 4);
    ctx.fillStyle = 'rgba(0,255,0,0.35)';
    ctx.textAlign = 'right'; ctx.fillText('v2.A', W - 5, H - 4);

    tick++;
  }
  setInterval(draw, 40);
})();


// ════════════════════════════════════════════════════════
// C. LIGHTING EFFECT
// ════════════════════════════════════════════════════════
(function(){
  const c = document.getElementById('cC');
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const cx = W / 2, headY = 54;
  let tick = 0;

  // Light from upper-right (screen/monitor direction)
  const LX = W * 0.78, LY = -18;

  const particles = Array.from({length: 48}, () => {
    const a = Math.random() * Math.PI * 2;
    return {
      r:   32 + Math.random() * 48,
      a,
      spd: (Math.random() - 0.5) * 0.013,
      sz:  0.5 + Math.random() * 1.6,
      lf:  Math.random(),
      lit: Math.cos(a) > 0,
    };
  });

  function headPath(hx, hy) {
    ctx.beginPath();
    ctx.moveTo(hx, hy + 42);
    ctx.bezierCurveTo(hx - 24, hy + 36, hx - 30, hy + 14, hx - 27, hy - 6);
    ctx.bezierCurveTo(hx - 25, hy - 22, hx - 16, hy - 34, hx - 10, hy - 38);
    ctx.bezierCurveTo(hx -  4, hy - 41, hx +  4, hy - 41, hx + 10, hy - 38);
    ctx.bezierCurveTo(hx + 16, hy - 34, hx + 25, hy - 22, hx + 27, hy - 6);
    ctx.bezierCurveTo(hx + 30, hy + 14, hx + 24, hy + 36, hx, hy + 42);
    ctx.closePath();
  }

  function hairPath(hx, hy) {
    ctx.beginPath();
    ctx.moveTo(hx - 24, hy - 12);
    ctx.bezierCurveTo(hx - 29, hy - 40, hx - 15, hy - 58, hx,       hy - 61);
    ctx.bezierCurveTo(hx + 15, hy - 58, hx + 29, hy - 40, hx + 24,  hy - 12);
    ctx.bezierCurveTo(hx + 18, hy - 38, hx +  6, hy - 47, hx,       hy - 47);
    ctx.bezierCurveTo(hx -  6, hy - 47, hx - 18, hy - 38, hx - 24,  hy - 12);
    ctx.closePath();
  }

  function draw() {
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fillRect(0, 0, W, H);

    const pulse = 0.9 + Math.sin(tick * 0.035) * 0.1;
    const hx = cx, hy = headY;

    // particles — brighter on lit side
    particles.forEach(p => {
      p.a  += p.spd;
      p.lf  = (p.lf + 0.007) % 1;
      const px = hx + Math.cos(p.a) * p.r;
      const py = hy + Math.sin(p.a) * p.r * 0.52;
      const al = Math.sin(p.lf * Math.PI) * (p.lit ? 0.72 : 0.28);
      ctx.save();
      ctx.shadowColor = '#00ff00'; ctx.shadowBlur = p.lit ? 5 : 2;
      ctx.fillStyle = `rgba(0,${p.lit ? 255 : 160},${p.lit ? 80 : 40},${al})`;
      ctx.beginPath(); ctx.arc(px, py, p.sz * (p.lit ? 1 : 0.65), 0, Math.PI*2); ctx.fill();
      ctx.restore();
    });

    ctx.save();

    // — HAIR BASE —
    ctx.shadowColor = '#00ff00'; ctx.shadowBlur = 8;
    ctx.fillStyle = 'rgba(0,20,0,1)';
    hairPath(hx, hy); ctx.fill();

    // hair lighting (rim on right top)
    ctx.save();
    hairPath(hx, hy); ctx.clip();
    const hl = ctx.createRadialGradient(hx + 14, hy - 48, 0, hx + 14, hy - 48, 36);
    hl.addColorStop(0, 'rgba(0,110,25,0.65)');
    hl.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = hl; ctx.fillRect(hx - 8, hy - 68, 55, 62);
    ctx.restore();

    // — FACE BASE (dark shadow) —
    ctx.shadowBlur = 12;
    ctx.fillStyle = 'rgba(0,18,0,0.98)';
    headPath(hx, hy); ctx.fill();

    // main directional light (radial from upper-right)
    ctx.save();
    headPath(hx, hy); ctx.clip();
    const ml = ctx.createRadialGradient(hx + 20, hy - 25, 0, hx + 20, hy - 25, 72);
    ml.addColorStop(0,    'rgba(0,170,42,0.85)');
    ml.addColorStop(0.28, 'rgba(0,110,24,0.55)');
    ml.addColorStop(0.58, 'rgba(0,50,10,0.22)');
    ml.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = ml; ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // rim light — left edge (opposite of main light)
    ctx.save();
    headPath(hx, hy); ctx.clip();
    const rl = ctx.createLinearGradient(hx - 32, hy, hx - 8, hy);
    rl.addColorStop(0,   `rgba(0,255,90,${0.52 * pulse})`);
    rl.addColorStop(0.45, 'rgba(0,160,40,0.18)');
    rl.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = rl; ctx.fillRect(hx - 36, hy - 52, 30, 105);
    ctx.restore();

    // specular highlight — forehead bright spot
    ctx.save();
    headPath(hx, hy); ctx.clip();
    const sp = ctx.createRadialGradient(hx + 11, hy - 27, 0, hx + 11, hy - 27, 20);
    sp.addColorStop(0,   `rgba(120,255,150,${0.3 * pulse})`);
    sp.addColorStop(0.5, 'rgba(40,180,60,0.12)');
    sp.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = sp; ctx.fillRect(hx - 5, hy - 52, 48, 38);
    ctx.restore();

    // chin shadow — underside dark
    ctx.save();
    headPath(hx, hy); ctx.clip();
    const cs2 = ctx.createLinearGradient(0, hy + 28, 0, hy + 44);
    cs2.addColorStop(0, 'rgba(0,0,0,0)');
    cs2.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = cs2; ctx.fillRect(hx - 35, hy + 24, 70, 24);
    ctx.restore();

    // — FACE OUTLINE —
    // shadow side (left) — dim
    ctx.shadowBlur = 4;
    ctx.strokeStyle = 'rgba(0,100,25,0.38)'; ctx.lineWidth = 1.2;
    headPath(hx, hy); ctx.stroke();
    // lit side (right) — bright stroke
    ctx.shadowBlur = 10;
    ctx.strokeStyle = `rgba(0,255,80,${0.65 * pulse})`; ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(hx + 10, hy - 38);
    ctx.bezierCurveTo(hx + 16, hy - 34, hx + 25, hy - 22, hx + 27, hy - 6);
    ctx.bezierCurveTo(hx + 30, hy + 14, hx + 24, hy + 36, hx, hy + 42);
    ctx.stroke();

    // — EYEBROWS — lit right / dim left
    ctx.lineCap = 'round';
    ctx.shadowBlur = 6;
    ctx.strokeStyle = `rgba(0,240,65,${0.72 * pulse})`; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(hx + 5, hy - 18); ctx.quadraticCurveTo(hx + 13, hy - 22, hx + 20, hy - 17);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(0,140,35,0.45)'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(hx - 20, hy - 17); ctx.quadraticCurveTo(hx - 13, hy - 22, hx - 5, hy - 18);
    ctx.stroke();

    // — EYES — right lit, left dim
    // left (shadow)
    ctx.shadowBlur = 7;
    ctx.fillStyle = 'rgba(0,170,45,0.72)';
    ctx.beginPath(); ctx.ellipse(hx - 12, hy - 9, 5.5, 3.8, 0, 0, Math.PI*2); ctx.fill();
    // right (lit)
    ctx.shadowBlur = 14;
    ctx.fillStyle = `rgba(0,255,80,${0.92 + Math.sin(tick * 0.03) * 0.06})`;
    ctx.beginPath(); ctx.ellipse(hx + 12, hy - 9, 5.5, 3.8, 0, 0, Math.PI*2); ctx.fill();
    // highlights
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(190,255,215,0.65)';
    ctx.beginPath(); ctx.ellipse(hx + 14, hy - 11, 1.6, 1.1, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(140,255,170,0.25)';
    ctx.beginPath(); ctx.ellipse(hx - 10, hy - 11, 1.3, 0.9,  0.3, 0, Math.PI*2); ctx.fill();

    // — NOSE (dim) —
    ctx.shadowBlur = 2;
    ctx.strokeStyle = 'rgba(0,160,38,0.28)'; ctx.lineWidth = 0.9; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hx - 1, hy - 2); ctx.lineTo(hx - 3, hy + 8);
    ctx.bezierCurveTo(hx - 3, hy + 12, hx + 3, hy + 12, hx + 3, hy + 8);
    ctx.lineTo(hx + 1, hy - 2);
    ctx.stroke();

    // — NECK —
    ctx.shadowBlur = 5;
    const ng = ctx.createLinearGradient(hx - 13, 0, hx + 13, 0);
    ng.addColorStop(0,   'rgba(0,10,0,0.96)');
    ng.addColorStop(0.65,'rgba(0,48,12,0.92)');
    ng.addColorStop(1,   'rgba(0,28,6,0.94)');
    ctx.fillStyle = ng;
    ctx.beginPath();
    ctx.moveTo(hx - 9, hy + 43); ctx.lineTo(hx + 9, hy + 43);
    ctx.lineTo(hx + 12, hy + 62); ctx.lineTo(hx - 12, hy + 62);
    ctx.closePath(); ctx.fill();

    // — SHOULDERS —
    ctx.shadowBlur = 10 * pulse;
    const shg = ctx.createLinearGradient(0, hy + 62, W, hy + 62);
    shg.addColorStop(0,    'rgba(0,8,0,0.96)');
    shg.addColorStop(0.42, 'rgba(0,18,4,0.96)');
    shg.addColorStop(0.62, 'rgba(0,58,14,0.92)');
    shg.addColorStop(1,    'rgba(0,28,6,0.94)');
    ctx.fillStyle = shg;
    ctx.beginPath();
    ctx.moveTo(hx - 13, hy + 62); ctx.lineTo(hx + 13, hy + 62);
    ctx.lineTo(hx + 78, H + 2);   ctx.lineTo(hx - 78, H + 2);
    ctx.closePath(); ctx.fill();
    // lit shoulder edge (right)
    ctx.strokeStyle = `rgba(0,255,80,${0.48 * pulse})`; ctx.lineWidth = 1.5; ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(hx + 13, hy + 62);
    ctx.bezierCurveTo(hx + 36, hy + 66, hx + 60, hy + 78, hx + 78, H + 2);
    ctx.stroke();
    // shadow shoulder edge (left)
    ctx.strokeStyle = 'rgba(0,100,24,0.3)'; ctx.lineWidth = 1.2; ctx.shadowBlur = 3;
    ctx.beginPath();
    ctx.moveTo(hx - 13, hy + 62);
    ctx.bezierCurveTo(hx - 36, hy + 66, hx - 60, hy + 78, hx - 78, H + 2);
    ctx.stroke();

    ctx.restore();

    // subtle light source glow at top-right
    const lsg = ctx.createRadialGradient(LX, LY + 14, 0, LX, LY + 14, 60);
    lsg.addColorStop(0, 'rgba(0,255,80,0.05)');
    lsg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = lsg; ctx.fillRect(0, 0, W, 45);

    // scanlines
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1);

    // sweep
    const sy = (tick * 1.5) % (H + 10) - 5;
    const sweepG = ctx.createLinearGradient(0, sy - 6, 0, sy + 6);
    sweepG.addColorStop(0,   'rgba(0,255,0,0)');
    sweepG.addColorStop(0.5, 'rgba(0,255,0,0.09)');
    sweepG.addColorStop(1,   'rgba(0,255,0,0)');
    ctx.fillStyle = sweepG; ctx.fillRect(0, sy - 6, W, 12);

    // corner brackets
    const bk = 9;
    ctx.strokeStyle = 'rgba(0,255,0,0.5)'; ctx.lineWidth = 1.5;
    [[0,0,1,1],[W,0,-1,1],[0,H,1,-1],[W,H,-1,-1]].forEach(([x,y,sx,sy2]) => {
      ctx.beginPath();
      ctx.moveTo(x + sx*bk, y); ctx.lineTo(x, y); ctx.lineTo(x, y + sy2*bk);
      ctx.stroke();
    });

    ctx.font = "5px 'Press Start 2P',monospace";
    ctx.fillStyle = tick % 28 < 18 ? 'rgba(0,255,0,0.45)' : 'rgba(0,255,0,0.1)';
    ctx.textAlign = 'left';  ctx.fillText('ID-LIGHT', 5, H - 4);
    ctx.fillStyle = 'rgba(0,255,0,0.35)';
    ctx.textAlign = 'right'; ctx.fillText('v2.C', W - 5, H - 4);

    tick++;
  }
  setInterval(draw, 40);
})();

}, 100);
</script>
