<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SET — MEASURE</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Press Start 2P',monospace !important; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; color:#00ff00; }
body { opacity:1; transition:opacity 0.3s; }
body.leaving { opacity:0; }
#pageWrap { position:fixed; inset:0; display:flex; flex-direction:column; }
#content { flex:1; overflow:hidden; }
iframe { display:block; width:100%; height:100%; border:none; }
</style>
</head>
<body>
<div id="pageWrap">
  <div id="content">
    <iframe id="measureIframe" src="measure-combined.html"></iframe>
  </div>
</div>
<script>
function navigate(url) {
  document.body.classList.add('leaving');
  setTimeout(() => { window.location.href = url; }, 320);
}

// measurePhotos 데이터를 iframe에 전달
function sendToMeasure(photos) {
  const mf = document.getElementById('measureIframe');
  if (mf && mf.contentWindow && photos.length > 0) {
    mf.contentWindow.postMessage({ type:'measurePhotos', photos }, '*');
  }
}

window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'measureReady') {
    if (window._measurePhotos && window._measurePhotos.length > 0) {
      sendToMeasure(window._measurePhotos);
    }
  }
});

document.getElementById('measureIframe').addEventListener('load', function() {
  if (window._measurePhotos && window._measurePhotos.length > 0) {
    sendToMeasure(window._measurePhotos);
  }
});

// admin-contents.json에서 사진 데이터 로드 + 평면화
function flattenPhotos(node) {
  if (!node) return [];
  if (node.type !== 'sheet') {
    if (node.verdict && node.verdict !== 'drop' && node.dir) return [node];
    return [];
  }
  const r = [];
  for (const c of (node.children || [])) r.push(...flattenPhotos(c));
  return r;
}

function flattenMeasurePhotos(data) {
  const results = [];
  const sections = ['project','inclusion','intro','archive'];
  for (const sec of sections) {
    if (data[sec] && data[sec].photos) {
      for (const root of data[sec].photos) results.push(...flattenPhotos(root));
    }
  }
  return results;
}

const ts = Date.now();
const base = 'https://raw.githubusercontent.com/note-a/note-a-github/main/';
fetch(base + 'admin-contents.json?t=' + ts)
  .then(r => r.ok ? r.json() : Promise.reject())
  .catch(() => fetch('./admin-contents.json?t=' + ts).then(r => r.ok ? r.json() : {}))
  .then(data => {
    if (data) {
      const photos = flattenMeasurePhotos(data);
      if (photos.length > 0) {
        window._measurePhotos = photos;
        sendToMeasure(photos);
      }
    }
  })
  .catch(() => {});
</script>
</body>
</html>
