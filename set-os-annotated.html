<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>set-os — annotated</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}

#container{position:relative;width:100%;height:100%;}

iframe#site{
  width:100%;height:100%;
  border:none;display:block;
}

#ann-layer{
  position:absolute;inset:0;
  pointer-events:none;
  z-index:9999;
  font-family:'Courier New',monospace;
}

.ann{
  position:absolute;
  pointer-events:none;
  box-sizing:border-box;
}

.ann-lbl{
  position:absolute;
  font-size:9px;
  color:#ffd700;
  background:rgba(0,0,0,.82);
  padding:1px 5px;
  letter-spacing:.5px;
  white-space:nowrap;
  line-height:15px;
  z-index:1;
}
.ann-lbl.tl{top:-15px;left:0;}
.ann-lbl.tr{top:-15px;right:0;}
.ann-lbl.bl{bottom:-15px;left:0;}
.ann-lbl.br{bottom:-15px;right:0;}
.ann-lbl.in{top:2px;left:3px;}
.ann-lbl.in-br{bottom:2px;right:3px;}

/* color variants */
.ann.yellow{border:1px solid rgba(255,200,0,.55);}
.ann.cyan  {border:1px solid rgba(0,220,200,.45);}
.ann.green {border:1px solid rgba(80,220,80,.45);}
.ann.pink  {border:1px solid rgba(220,80,160,.45);}
.ann.blue  {border:1px solid rgba(80,140,255,.45);}
.ann.orange{border:1px solid rgba(255,140,40,.45);}
.ann.gray  {border:1px dashed rgba(160,160,160,.3);}
.ann.red   {border:1px dashed rgba(255,80,80,.45);}

.ann-lbl.yellow{color:#ffd700;}
.ann-lbl.cyan  {color:#00dcc8;}
.ann-lbl.green {color:#50dc50;}
.ann-lbl.pink  {color:#dc50a0;}
.ann-lbl.blue  {color:#508fff;}
.ann-lbl.orange{color:#ff8c28;}
.ann-lbl.gray  {color:#aaaaaa;}
.ann-lbl.red   {color:#ff5050;}

/* corner tick marks */
.ann.yellow::before,.ann.cyan::before,.ann.green::before,
.ann.pink::before,.ann.blue::before,.ann.orange::before{
  content:'';
  position:absolute;
  top:-3px;left:-3px;
  width:5px;height:5px;
  border-top:1px solid currentColor;
  border-left:1px solid currentColor;
}
</style>
</head>
<body>
<div id="container">
  <iframe id="site" src="set-os.html"></iframe>
  <div id="ann-layer"></div>
</div>

<script>
const site  = document.getElementById('site');
const layer = document.getElementById('ann-layer');

/* ─── annotation config ─── */
const TARGETS = [
  /* ── OUTERMOST ── */
  { s:'#shell',      lbl:'#shell',                   pos:'bl', c:'gray' },
  { s:'#wrap',       lbl:'div#wrap',                 pos:'bl', c:'yellow' },

  /* ── RAILS ── */
  { s:'.lr-rail',    lbl:'aside.lr-rail (hidden <1560px)',  pos:'tl', c:'cyan' },
  { s:'.rr-rail',    lbl:'aside.rr-rail (hidden <1560px)',  pos:'tl', c:'cyan' },

  /* ── TOP ROW ── */
  { s:'#top-row',    lbl:'#top-row (grid-cols: 1fr 1fr 1fr)', pos:'tl', c:'yellow' },

  /* Panel 1: gallery */
  { s:'#top-row > .pnl:first-child',         lbl:'.pnl', pos:'tl', c:'orange' },
  { s:'#top-row > .pnl:first-child .ph',     lbl:'.ph (헤더: .ph-row1 / .ph-row2 / .ph-nav)', pos:'tl', c:'orange' },
  { s:'#gly-1',      lbl:'#gly-1 .view.active — ANALYSIS', pos:'tl', c:'green' },
  { s:'#gva-wrap',   lbl:'#gva-wrap', pos:'tl', c:'green' },
  { s:'#gl-scatter', lbl:'#gl-scatter (svg)', pos:'bl', c:'green' },
  { s:'#gly-2',      lbl:'#gly-2 .view [display:none]',     pos:'tl', c:'red' },
  { s:'#gly-3',      lbl:'#gly-3 .view [display:none]',     pos:'tl', c:'red' },

  /* Panel 2: HUD */
  { s:'#hud-pnl',    lbl:'#hud-pnl .pnl ▸ <HUD.XT2>', pos:'tl', c:'orange' },
  { s:'.h-title',    lbl:'.h-title (.h-logo / .h-badges / .h-menu / .h-search)', pos:'tl', c:'cyan' },
  { s:'.h-folders',  lbl:'.h-folders ▸ .fld-item × 14', pos:'bl', c:'cyan' },
  { s:'.h-list',     lbl:'.h-list (.h-cols + .h-rows)', pos:'tl', c:'blue' },

  /* Panel 3 */
  { s:'#top-row > .pnl:last-child', lbl:'.pnl ▸ .ctrl-btn × 3 (UP/EXIT/DOWN)', pos:'tr', c:'orange' },

  /* ── GBAR ── */
  { s:'#gbar',       lbl:'div#gbar ▸ iframe(gbar) · SET.OS바', pos:'tl', c:'yellow' },
  { s:'.mode-row',   lbl:'.mode-row ▸ .mb × 6', pos:'bl', c:'yellow' },
  { s:'button.activate', lbl:'button.activate', pos:'br', c:'yellow' },

  /* ── BOT ROW ── */
  { s:'#bot-row',    lbl:'#bot-row (grid-cols: 1fr 2fr)', pos:'tl', c:'yellow' },
  { s:'.bot-left',   lbl:'.bot-left', pos:'tl', c:'orange' },
  { s:'.bl-split',   lbl:'.bl-split ▼', pos:'tl', c:'cyan' },

  /* bl-split panels */
  { s:'#vlWindow',   lbl:'iframe(id-card) ID카드', pos:'tl', c:'pink' },

  /* stmt + pc */
  { s:'#stmt',       lbl:'#stmt .stmt-scroll (SET.TEXT)', pos:'tr', c:'green' },
  { s:'.pc',         lbl:'.pc — 프로세싱 콘솔', pos:'tl', c:'blue' },
  { s:'.pc-log',     lbl:'.pc-log', pos:'tl', c:'blue' },
  { s:'.pc-input',   lbl:'.pc-input', pos:'bl', c:'blue' },
  { s:'.pc-fkeys',   lbl:'.pc-fkeys', pos:'bl', c:'blue' },

  /* ── BOTBAR ── */
  { s:'#botbar',     lbl:'div#botbar (상태바)', pos:'tl', c:'yellow' },

  /* ── MODALS (hidden) ── */
  { s:'#stmt-modal', lbl:'#stmt-modal [display:none]', pos:'tl', c:'red' },
  { s:'#docs-modal', lbl:'#docs-modal [display:none]', pos:'tl', c:'red' },

  /* ── GVA overlays ── */
  { s:'#gva-access', lbl:'#gva-access [hidden]', pos:'in', c:'red' },
  { s:'#gva-glitch', lbl:'#gva-glitch [hidden]', pos:'in-br', c:'red' },
];

function addAnn(rect, lbl, pos, c) {
  const frameRect = site.getBoundingClientRect();
  const x = frameRect.left + rect.left;
  const y = frameRect.top  + rect.top;

  const box = document.createElement('div');
  box.className = `ann ${c}`;
  box.style.cssText = `left:${x}px;top:${y}px;width:${rect.width}px;height:${rect.height}px;`;

  const tag = document.createElement('div');
  tag.className = `ann-lbl ${pos} ${c}`;
  tag.textContent = lbl;
  box.appendChild(tag);
  layer.appendChild(box);
}

function runAnnotation() {
  layer.innerHTML = '';
  const iDoc = site.contentDocument;
  if (!iDoc) return;

  TARGETS.forEach(({ s, lbl, pos, c }) => {
    const el = iDoc.querySelector(s);
    if (!el) return;
    const r = el.getBoundingClientRect();
    if (r.width < 1 || r.height < 1) return;
    addAnn(r, lbl, pos, c);
  });
}

site.addEventListener('load', () => {
  const iDoc = site.contentDocument;

  /* auto-dismiss intro */
  const intro = iDoc.getElementById('intro');
  if (intro) {
    intro.classList.add('exit');
    setTimeout(() => { intro.style.display = 'none'; }, 800);
  }

  /* wait for layout, then annotate */
  setTimeout(runAnnotation, 1400);

  /* re-annotate on resize */
  site.contentWindow.addEventListener('resize', () => {
    setTimeout(runAnnotation, 200);
  });
});
</script>
</body>
</html>
