<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>REFERENCE — Library</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--mono:'IBM Plex Mono',monospace;--acc:#d96a0e;--acc2:#a04a00;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#000;font-family:var(--mono);overflow:hidden;height:100%;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(0,0,0,.045) 3px,rgba(0,0,0,.045) 4px);}

.nav{
  position:fixed;top:0;left:0;right:0;z-index:200;height:30px;
  display:flex;align-items:stretch;
  border-bottom:1px solid #1e0e00;background:#050300;}
.nav-back{
  display:flex;align-items:center;padding:0 12px;
  font-size:7px;letter-spacing:1.5px;color:#3a1a00;
  border-right:1px solid #1a0a00;cursor:pointer;transition:color .12s;
  text-decoration:none;}
.nav-back:hover{color:var(--acc);}
.nav-title{
  display:flex;align-items:center;padding:0 14px;
  font-size:7px;letter-spacing:2px;color:#5a2800;
  border-right:1px solid #1a0a00;}
.nav-sep{flex:1;}
.nav-filter{
  display:flex;align-items:center;padding:0 14px;
  font-size:6.5px;letter-spacing:1.5px;color:#3a1a00;
  border-left:1px solid #1a0a00;cursor:pointer;transition:color .12s;
  user-select:none;}
.nav-filter:hover{color:#886020;}
.nav-filter.on{color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc2);}
.nav-count{
  display:flex;align-items:center;padding:0 12px;
  font-size:6.5px;letter-spacing:1px;color:#2a1200;
  border-left:1px solid #1a0a00;}

#ref-canvas{
  position:fixed;top:30px;left:0;right:0;bottom:0;
  width:100%;height:calc(100% - 30px);
  cursor:none;display:block;}

#detail-panel{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:84px;border-top:1px solid #1e0e00;background:rgba(5,3,0,.96);
  display:flex;align-items:center;padding:0 24px;gap:20px;
  transform:translateY(100%);transition:transform .2s ease;pointer-events:none;}
#detail-panel.on{transform:translateY(0);pointer-events:auto;}
#detail-close{
  position:absolute;right:14px;top:10px;
  font-size:6px;letter-spacing:1px;color:#3a1a00;cursor:pointer;padding:4px 8px;}
#detail-close:hover{color:var(--acc);}
</style>
</head>
<body>

<div class="nav">
  <a class="nav-back" href="set-os.html">← SET·OS</a>
  <div class="nav-title">REFERENCE · LIBRARY</div>
  <div class="nav-sep"></div>
  <div class="nav-filter on"  onclick="setFilter('all',this)">ALL</div>
  <div class="nav-filter"     onclick="setFilter('book',this)">BOOK</div>
  <div class="nav-filter"     onclick="setFilter('idea',this)">IDEA</div>
  <div class="nav-filter"     onclick="setFilter('ref',this)">REF</div>
  <div class="nav-filter"     onclick="setFilter('exhibit',this)">EXHIBIT</div>
  <div class="nav-count" id="nav-count">— items</div>
</div>

<canvas id="ref-canvas"></canvas>

<div id="detail-panel">
  <div id="detail-type" style="font-size:5.5px;letter-spacing:2px;width:54px;flex-shrink:0;line-height:1.8;"></div>
  <div style="width:1px;height:52px;flex-shrink:0;background:#1e0e00;"></div>
  <div style="flex:1;min-width:0;">
    <div id="detail-title" style="font-size:15px;color:#c87828;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
    <div id="detail-sub" style="font-size:7px;color:#5a3010;margin-bottom:6px;"></div>
    <div id="detail-excerpt" style="font-size:7.5px;color:#7a5020;line-height:1.65;font-style:italic;border-left:2px solid #1e0e00;padding-left:8px;"></div>
  </div>
  <div id="detail-tags" style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;align-items:flex-end;padding-right:24px;"></div>
  <div id="detail-close" onclick="closeDetail()">✕ CLOSE</div>
</div>

<script>
/* ════════════════════════
   DATA
════════════════════════ */
const ITEMS=[
  {id:0,type:'book',
   title:'밝은 방',sub:'Roland Barthes · 1980',
   excerpt:'punctum — 찌름. studium이 아닌 것, 그것이 나를 쏜다.',
   tags:['photography','theory'],x:.12,y:.18},
  {id:1,type:'book',
   title:'사진에 관하여',sub:'Susan Sontag · 1977',
   excerpt:'사진 찍는 행위는 세계를 소유하는 것이다. 이미지를 전유하는 것.',
   tags:['photography','theory'],x:.52,y:.12},
  {id:2,type:'book',
   title:'눈의 문법',sub:'John Szarkowski · 1966',
   excerpt:'가장자리, 디테일, 평면, 시간, 사물 자체의 것. 사진의 다섯 속성.',
   tags:['photography'],x:.28,y:.52},
  {id:3,type:'book',
   title:'Ways of Seeing',sub:'John Berger · 1972',
   excerpt:'우리는 먼저 보고 나서 말한다. 보는 방식이 우리가 아는 것보다 먼저다.',
   tags:['theory'],x:.72,y:.42},
  {id:4,type:'book',
   title:'The Ongoing Moment',sub:'Geoff Dyer · 2005',
   excerpt:'이미지는 이미지를 낳는다. 사진가들은 서로의 그림자를 찍는다.',
   tags:['photography'],x:.62,y:.72},
  {id:5,type:'book',
   title:'집합론',sub:'Georg Cantor · 1874',
   excerpt:'무한한 집합의 기수는 비교 가능하다. 부분이 전체와 같은 크기를 가질 수 있다.',
   tags:['set·math'],x:.18,y:.78},
  {id:6,type:'book',
   title:'수학의 언어',sub:'Keith Devlin · 1998',
   excerpt:'수학은 패턴의 과학이다. 시각적 패턴, 논리적 패턴, 관계의 패턴.',
   tags:['set·math'],x:.82,y:.22},
  {id:7,type:'book',
   title:'On Photography',sub:'Susan Sontag · 1977',
   excerpt:'카메라는 세계를 기록하는 것이 아니라 세계를 해석한다.',
   tags:['photography','theory'],x:.4,y:.35},
  {id:8,type:'idea',
   title:'선택과 배제',sub:'작업 메모 · 2026',
   excerpt:'셀렉션은 포함의 행위가 아니라 배제의 행위다. 살아남은 것이 아닌 탈락한 것이 집합을 정의한다.',
   tags:['photography','set·math'],x:.45,y:.62},
  {id:9,type:'idea',
   title:'프레임의 정치',sub:'작업 메모 · 2025',
   excerpt:'무엇을 프레임 안에 넣는가는 권력의 문제다. 가장자리가 의미를 만든다.',
   tags:['photography','theory'],x:.22,y:.42},
  {id:10,type:'idea',
   title:'집합적 셀렉션',sub:'프로젝트 아이디어 · 2026',
   excerpt:'438장 → 부분집합. 셀렉션 과정 자체를 집합론의 언어로 기록할 수 있을까.',
   tags:['set·math','photography'],x:.68,y:.28},
  {id:11,type:'idea',
   title:'배제의 미학',sub:'메모 · 2026',
   excerpt:'버린 사진들의 아카이브. 탈락한 것들이 선택된 것들보다 더 많이 말한다.',
   tags:['photography'],x:.35,y:.85},
  {id:12,type:'idea',
   title:'측정과 기록',sub:'작업 방향 · 2026',
   excerpt:'수치화할 수 없는 것을 수치화하려는 시도. 그 실패 자체가 작업이 된다.',
   tags:['set·math'],x:.78,y:.60},
  {id:13,type:'ref',
   title:'New Topographics',sub:'William Jenkins · 1975',
   excerpt:'평범한 것의 날카로움. 산업 풍경, 주차장, 창고. 아름답지 않은 것들의 아름다움.',
   tags:['photography'],x:.08,y:.55},
  {id:14,type:'ref',
   title:'Bernd & Hilla Becher',sub:'Typologien · 1963–2007',
   excerpt:'유형학적 반복. 물탱크, 고로, 가스탱크. 비교를 통해 형태가 드러난다.',
   tags:['photography'],x:.58,y:.48},
  {id:15,type:'ref',
   title:'August Sander',sub:'Menschen des 20. Jahrhunderts',
   excerpt:'유형으로서의 초상. 개인이 아닌 계층, 직업, 시대의 표본.',
   tags:['photography'],x:.85,y:.72},
  {id:16,type:'exhibit',
   title:'한국 현대사진 60년',sub:'국립현대미술관 · 2017',
   excerpt:'다큐멘터리에서 개념미술까지. 한국 사진의 계보를 한 번에.',
   tags:['photography'],x:.3,y:.22},
  {id:17,type:'exhibit',
   title:'The Family of Man',sub:'MoMA · 1955',
   excerpt:'503점. 인류 보편의 서사. 동시에 냉전 시대의 이데올로기.',
   tags:['photography','theory'],x:.75,y:.85},
];

const TC={book:'#e8803a',idea:'#a070e8',ref:'#38b09a',exhibit:'#d4b040'};

let cvs,ctx;
let mx=null,my=null;
let time=0;
let filter='all';
let selected=-1;
const LOUPE_R=140;
const ZOOM=1.9;

function visibleItems(){
  return filter==='all'?ITEMS:ITEMS.filter(b=>b.type===filter);
}

function setFilter(f,el){
  filter=f;selected=-1;closeDetail();
  document.querySelectorAll('.nav-filter').forEach(e=>e.classList.remove('on'));
  el.classList.add('on');
  updateCount();
}
function updateCount(){
  document.getElementById('nav-count').textContent=visibleItems().length+' items';
}

function openDetail(item){
  selected=item.id;
  const tc=TC[item.type];
  document.getElementById('detail-type').style.color=tc;
  document.getElementById('detail-type').innerHTML=
    `<div style="font-size:5.5px;letter-spacing:2px;margin-bottom:2px;">${item.type.toUpperCase()}</div>
     <div style="font-size:5px;letter-spacing:1px;color:#2a1200;">#${String(item.id+1).padStart(2,'0')}</div>`;
  document.getElementById('detail-title').textContent=item.title;
  document.getElementById('detail-title').style.color=tc;
  document.getElementById('detail-sub').textContent=item.sub;
  document.getElementById('detail-excerpt').textContent='"'+item.excerpt+'"';
  document.getElementById('detail-tags').innerHTML=
    item.tags.map(t=>`<div style="font-size:5.5px;letter-spacing:1.5px;color:#3a2010;border:1px solid #2a1408;padding:2px 7px;">${t}</div>`).join('');
  document.getElementById('detail-panel').classList.add('on');
}
function closeDetail(){
  selected=-1;
  document.getElementById('detail-panel').classList.remove('on');
}

function init(){
  cvs=document.getElementById('ref-canvas');
  ctx=cvs.getContext('2d');
  resize();
  window.addEventListener('resize',resize);
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY-30;});
  document.addEventListener('mouseleave',()=>{mx=null;my=null;});
  cvs.addEventListener('click',e=>{
    if(mx===null)return;
    const cx=e.clientX,cy=e.clientY-30;
    const W=cvs.width,H=cvs.height;
    const d=Math.sqrt((cx-mx)**2+(cy-my)**2);
    if(d>LOUPE_R){closeDetail();return;}
    // 루페 내 클릭 → 아이템 좌표 역변환 (루페 확대 역으로)
    const rx=mx+(cx-mx)*ZOOM;
    const ry=my+(cy-my)*ZOOM;
    const hit=visibleItems().find(b=>{
      const bx=b.x*W,by=b.y*H;
      return Math.abs(rx-bx)<96&&Math.abs(ry-by)<40;
    });
    if(hit)openDetail(hit);else closeDetail();
  });
  updateCount();
  (function loop(){time+=.011;draw();requestAnimationFrame(loop);})();
}

function resize(){
  cvs.width=window.innerWidth;
  cvs.height=window.innerHeight-30;
}

function draw(){
  const W=cvs.width,H=cvs.height;
  if(!W||!H)return;

  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  // 세이프라이트
  [[0,0],[W,0],[0,H],[W,H]].forEach(([cx2,cy2])=>{
    const g=ctx.createRadialGradient(cx2,cy2,0,cx2,cy2,W*.28);
    g.addColorStop(0,'rgba(140,18,0,.12)');g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  });

  const vis=visibleItems();

  if(mx===null){
    ctx.font='300 13px IBM Plex Mono';
    ctx.fillStyle='rgba(200,80,10,.18)';
    ctx.textAlign='center';
    ctx.fillText('루페를 움직여 현상하세요',W/2,H/2);
    ctx.font='300 7.5px IBM Plex Mono';
    ctx.fillStyle='rgba(180,60,10,.07)';
    ctx.fillText('DARKROOM  ·  MOVE LOUPE TO REVEAL  ·  CLICK TO EXPAND',W/2,H/2+22);
    return;
  }

  const lx=mx,ly=my;

  // 루페 바깥 — 희미한 윤곽
  vis.forEach(b=>{
    const bx=b.x*W,by=b.y*H;
    ctx.save();
    ctx.globalAlpha=.04;
    ctx.strokeStyle=TC[b.type];ctx.lineWidth=.5;
    ctx.strokeRect(bx-92,by-37,184,74);
    ctx.restore();
  });

  // ─── 루페 클리핑
  ctx.save();
  ctx.beginPath();ctx.arc(lx,ly,LOUPE_R,0,Math.PI*2);ctx.clip();

  const lbg=ctx.createRadialGradient(lx,ly,0,lx,ly,LOUPE_R);
  lbg.addColorStop(0,'rgba(24,14,6,1)');
  lbg.addColorStop(.75,'rgba(14,8,3,1)');
  lbg.addColorStop(1,'rgba(6,3,1,1)');
  ctx.fillStyle=lbg;ctx.fillRect(lx-LOUPE_R,ly-LOUPE_R,LOUPE_R*2,LOUPE_R*2);

  ctx.translate(lx,ly);ctx.scale(ZOOM,ZOOM);ctx.translate(-lx,-ly);

  vis.forEach((b,i)=>{
    const bx=b.x*W,by=b.y*H;
    const tc=TC[b.type];
    const fl=.94+Math.sin(time*1.4+i*1.7)*.06;
    const isSel=(b.id===selected);

    ctx.save();
    ctx.globalAlpha=(isSel?.95:.82)*fl;
    ctx.fillStyle=isSel?'#140d06':'#0e0906';
    ctx.fillRect(bx-92,by-37,184,74);

    if(isSel){ctx.globalAlpha=.14;ctx.fillStyle=tc;ctx.fillRect(bx-92,by-37,184,74);}

    const burn=ctx.createRadialGradient(bx,by+37,0,bx,by+37,120);
    burn.addColorStop(0,'transparent');burn.addColorStop(1,'rgba(70,20,0,.5)');
    ctx.fillStyle=burn;ctx.fillRect(bx-92,by-37,184,74);

    ctx.globalAlpha=(isSel?.88:.52)*fl;
    ctx.strokeStyle=tc;ctx.lineWidth=(isSel?1.2:.7)/ZOOM;
    ctx.strokeRect(bx-92,by-37,184,74);

    ctx.globalAlpha=.62*fl;
    ctx.font=`500 ${6/ZOOM*1.5}px IBM Plex Mono`;
    ctx.fillStyle=tc;ctx.textAlign='left';
    ctx.fillText(b.type.toUpperCase(),bx-82,by-23);

    ctx.globalAlpha=fl;
    ctx.font=`${isSel?600:500} ${13/ZOOM*1.5}px IBM Plex Mono`;
    ctx.fillStyle=isSel?tc:'rgba(215,165,80,1)';
    ctx.textAlign='center';ctx.fillText(b.title,bx,by+3);

    ctx.globalAlpha=.65*fl;
    ctx.font=`300 ${7.5/ZOOM*1.5}px IBM Plex Mono`;
    ctx.fillStyle='rgba(148,98,42,1)';
    ctx.fillText(b.sub,bx,by+17);

    ctx.globalAlpha=.52*fl;
    ctx.font=`300 ${6.5/ZOOM*1.5}px IBM Plex Mono`;
    ctx.fillStyle='rgba(170,132,65,1)';
    const ex=b.excerpt.length>38?b.excerpt.slice(0,38)+'…':b.excerpt;
    ctx.fillText(ex,bx,by+30);

    if(isSel){
      ctx.globalAlpha=.45;
      ctx.font=`300 ${5.5/ZOOM*1.5}px IBM Plex Mono`;
      ctx.fillStyle=tc;
      ctx.fillText('▼ 하단 패널에서 전체 보기',bx,by+44);
    }
    ctx.restore();
  });

  ctx.restore();

  // ─── 루페 링
  ctx.save();
  ctx.beginPath();ctx.arc(lx,ly,LOUPE_R,0,Math.PI*2);
  ctx.strokeStyle='rgba(210,160,80,.48)';ctx.lineWidth=1.5;ctx.stroke();

  ctx.beginPath();ctx.arc(lx,ly,LOUPE_R-4,0,Math.PI*2);
  ctx.strokeStyle='rgba(180,120,50,.1)';ctx.lineWidth=.8;ctx.stroke();

  ctx.beginPath();
  ctx.arc(lx-LOUPE_R*.2,ly-LOUPE_R*.26,LOUPE_R*.16,Math.PI*1.08,Math.PI*1.88);
  ctx.strokeStyle='rgba(255,245,210,.1)';ctx.lineWidth=3;ctx.stroke();
  ctx.restore();

  // 십자선
  ctx.save();
  ctx.strokeStyle='rgba(200,160,80,.1)';ctx.lineWidth=.5;
  ctx.setLineDash([2,6]);
  ctx.beginPath();ctx.moveTo(lx-LOUPE_R+18,ly);ctx.lineTo(lx+LOUPE_R-18,ly);ctx.stroke();
  ctx.beginPath();ctx.moveTo(lx,ly-LOUPE_R+18);ctx.lineTo(lx,ly+LOUPE_R-18);ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

init();
</script>
</body>
</html>
