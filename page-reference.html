<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>REFERENCE — Library</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --r0:#000000;
  --r1:#0a0000;
  --r2:#140000;
  --r3:#2a0000;
  --r4:#500000;
  --r5:#8a0a00;
  --r6:#c01800;
  --r7:#e83010;
  --r8:#ff5030;
  --mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--r0);font-family:var(--mono);overflow:hidden;height:100%;}

/* CRT 스캔라인 */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,
    transparent 0,transparent 3px,
    rgba(0,0,0,.05) 3px,rgba(0,0,0,.05) 4px);}

/* 빨간 앰비언스 오버레이 */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse 80% 80% at 50% 50%,
    transparent 40%, rgba(120,0,0,.18) 100%);}

/* ── nav ── */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:200;height:30px;
  display:flex;align-items:stretch;
  border-bottom:1px solid #2a0000;
  background:linear-gradient(180deg,#0a0000 0%,#060000 100%);}
.nav-back{
  display:flex;align-items:center;padding:0 13px;
  font-size:7px;letter-spacing:1.5px;color:#3a0800;
  border-right:1px solid #220000;cursor:pointer;transition:color .15s;
  text-decoration:none;}
.nav-back:hover{color:var(--r7);}
.nav-title{
  display:flex;align-items:center;padding:0 14px;
  font-size:7px;letter-spacing:2.5px;color:#5a0a00;
  border-right:1px solid #220000;}
.nav-sep{flex:1;}
.nav-filter{
  display:flex;align-items:center;padding:0 14px;
  font-size:6.5px;letter-spacing:1.5px;color:#3a0800;
  border-left:1px solid #220000;cursor:pointer;
  transition:color .15s;user-select:none;}
.nav-filter:hover{color:#9a1800;}
.nav-filter.on{
  color:var(--r7);
  box-shadow:inset 0 -2px 0 var(--r6);}
.nav-count{
  display:flex;align-items:center;padding:0 13px;
  font-size:6.5px;letter-spacing:1px;color:#280000;
  border-left:1px solid #1a0000;}

/* ── canvas ── */
#ref-canvas{
  position:fixed;top:30px;left:0;right:0;bottom:0;
  display:block;cursor:none;z-index:2;}

/* ── 상세 패널 ── */
#detail-panel{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  height:86px;
  border-top:1px solid #2a0000;
  background:linear-gradient(180deg,rgba(8,0,0,.98) 0%,rgba(4,0,0,1) 100%);
  display:flex;align-items:center;padding:0 24px;gap:22px;
  transform:translateY(100%);transition:transform .22s ease;pointer-events:none;}
#detail-panel.on{transform:translateY(0);pointer-events:auto;}
#detail-close{
  position:absolute;right:14px;top:10px;
  font-size:6px;letter-spacing:1.5px;color:#3a0800;cursor:pointer;padding:4px 8px;
  transition:color .12s;}
#detail-close:hover{color:var(--r7);}
</style>
</head>
<body>

<div class="nav">
  <a class="nav-back" href="set-os.html">← SET·OS</a>
  <div class="nav-title">REFERENCE · LIBRARY</div>
  <div class="nav-sep"></div>
  <div class="nav-filter on"  onclick="setFilter('all',this)">ALL</div>
  <div class="nav-filter"     onclick="setFilter('book',this)">BOOK</div>
  <div class="nav-filter"     onclick="setFilter('idea',this)">IDEA</div>
  <div class="nav-filter"     onclick="setFilter('ref',this)">REF</div>
  <div class="nav-filter"     onclick="setFilter('exhibit',this)">EXHIBIT</div>
  <div class="nav-count" id="nav-count"></div>
</div>

<canvas id="ref-canvas"></canvas>

<div id="detail-panel">
  <div id="dp-type" style="width:58px;flex-shrink:0;"></div>
  <div style="width:1px;height:54px;flex-shrink:0;background:#1e0000;"></div>
  <div style="flex:1;min-width:0;">
    <div id="dp-title" style="font-size:16px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
    <div id="dp-sub" style="font-size:7px;color:#4a1008;margin-bottom:7px;"></div>
    <div id="dp-excerpt" style="font-size:7.5px;color:#6a2015;line-height:1.65;font-style:italic;border-left:2px solid #1e0000;padding-left:8px;"></div>
  </div>
  <div id="dp-tags" style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;align-items:flex-end;padding-right:26px;"></div>
  <div id="detail-close" onclick="closeDetail()">✕ CLOSE</div>
</div>

<script>
/* ════════════════════════
   DATA
════════════════════════ */
const ITEMS=[
  {id:0,type:'book',
   title:'밝은 방',sub:'Roland Barthes · 1980',
   excerpt:'punctum — 찌름. studium이 아닌 것, 그것이 나를 쏜다.',
   tags:['photography','theory'],x:.12,y:.18},
  {id:1,type:'book',
   title:'사진에 관하여',sub:'Susan Sontag · 1977',
   excerpt:'사진 찍는 행위는 세계를 소유하는 것이다. 이미지를 전유하는 것.',
   tags:['photography','theory'],x:.52,y:.12},
  {id:2,type:'book',
   title:'눈의 문법',sub:'John Szarkowski · 1966',
   excerpt:'가장자리, 디테일, 평면, 시간, 사물 자체의 것. 사진의 다섯 속성.',
   tags:['photography'],x:.28,y:.52},
  {id:3,type:'book',
   title:'Ways of Seeing',sub:'John Berger · 1972',
   excerpt:'우리는 먼저 보고 나서 말한다. 보는 방식이 우리가 아는 것보다 먼저다.',
   tags:['theory'],x:.72,y:.42},
  {id:4,type:'book',
   title:'The Ongoing Moment',sub:'Geoff Dyer · 2005',
   excerpt:'이미지는 이미지를 낳는다. 사진가들은 서로의 그림자를 찍는다.',
   tags:['photography'],x:.62,y:.72},
  {id:5,type:'book',
   title:'집합론',sub:'Georg Cantor · 1874',
   excerpt:'무한한 집합의 기수는 비교 가능하다. 부분이 전체와 같은 크기를 가질 수 있다.',
   tags:['set·math'],x:.18,y:.78},
  {id:6,type:'book',
   title:'수학의 언어',sub:'Keith Devlin · 1998',
   excerpt:'수학은 패턴의 과학이다. 시각적 패턴, 논리적 패턴, 관계의 패턴.',
   tags:['set·math'],x:.82,y:.22},
  {id:7,type:'book',
   title:'On Photography',sub:'Susan Sontag · 1977',
   excerpt:'카메라는 세계를 기록하는 것이 아니라 세계를 해석한다.',
   tags:['photography','theory'],x:.4,y:.35},
  {id:8,type:'idea',
   title:'선택과 배제',sub:'작업 메모 · 2026',
   excerpt:'셀렉션은 포함의 행위가 아니라 배제의 행위다. 살아남은 것이 아닌 탈락한 것이 집합을 정의한다.',
   tags:['photography','set·math'],x:.45,y:.62},
  {id:9,type:'idea',
   title:'프레임의 정치',sub:'작업 메모 · 2025',
   excerpt:'무엇을 프레임 안에 넣는가는 권력의 문제다. 가장자리가 의미를 만든다.',
   tags:['photography','theory'],x:.22,y:.42},
  {id:10,type:'idea',
   title:'집합적 셀렉션',sub:'프로젝트 아이디어 · 2026',
   excerpt:'438장 → 부분집합. 셀렉션 과정 자체를 집합론의 언어로 기록할 수 있을까.',
   tags:['set·math','photography'],x:.68,y:.28},
  {id:11,type:'idea',
   title:'배제의 미학',sub:'메모 · 2026',
   excerpt:'버린 사진들의 아카이브. 탈락한 것들이 선택된 것들보다 더 많이 말한다.',
   tags:['photography'],x:.35,y:.85},
  {id:12,type:'idea',
   title:'측정과 기록',sub:'작업 방향 · 2026',
   excerpt:'수치화할 수 없는 것을 수치화하려는 시도. 그 실패 자체가 작업이 된다.',
   tags:['set·math'],x:.78,y:.60},
  {id:13,type:'ref',
   title:'New Topographics',sub:'William Jenkins · 1975',
   excerpt:'평범한 것의 날카로움. 산업 풍경, 주차장, 창고. 아름답지 않은 것들의 아름다움.',
   tags:['photography'],x:.08,y:.55},
  {id:14,type:'ref',
   title:'Bernd & Hilla Becher',sub:'Typologien · 1963–2007',
   excerpt:'유형학적 반복. 물탱크, 고로, 가스탱크. 비교를 통해 형태가 드러난다.',
   tags:['photography'],x:.58,y:.48},
  {id:15,type:'ref',
   title:'August Sander',sub:'Menschen des 20. Jahrhunderts',
   excerpt:'유형으로서의 초상. 개인이 아닌 계층, 직업, 시대의 표본.',
   tags:['photography'],x:.85,y:.72},
  {id:16,type:'exhibit',
   title:'한국 현대사진 60년',sub:'국립현대미술관 · 2017',
   excerpt:'다큐멘터리에서 개념미술까지. 한국 사진의 계보를 한 번에.',
   tags:['photography'],x:.3,y:.22},
  {id:17,type:'exhibit',
   title:'The Family of Man',sub:'MoMA · 1955',
   excerpt:'503점. 인류 보편의 서사. 동시에 냉전 시대의 이데올로기.',
   tags:['photography','theory'],x:.75,y:.85},
];

/* ════════════════════════
   TYPE 컬러 — 모두 레드 계열
════════════════════════ */
const TC={
  book:   '#ff3820',  // 브라이트 레드
  idea:   '#e0304c',  // 크림슨
  ref:    '#ff7030',  // 레드-오렌지
  exhibit:'#d0a040',  // 앰버 (대비)
};
const TC_DIM={
  book:   'rgba(255,56,32,.05)',
  idea:   'rgba(224,48,76,.05)',
  ref:    'rgba(255,112,48,.05)',
  exhibit:'rgba(208,160,64,.05)',
};

/* ════════════════════════
   STATE
════════════════════════ */
let cvs,ctx;
let mx=null,my=null;
let time=0;
let filter='all';
let selected=-1;
const LOUPE_R=145;
const ZOOM=1.9;

function visibleItems(){
  return filter==='all'?ITEMS:ITEMS.filter(b=>b.type===filter);
}

/* ════════════════════════
   FILTER / DETAIL
════════════════════════ */
function setFilter(f,el){
  filter=f;selected=-1;closeDetail();
  document.querySelectorAll('.nav-filter').forEach(e=>e.classList.remove('on'));
  el.classList.add('on');
  updateCount();
}
function updateCount(){
  const n=visibleItems().length;
  document.getElementById('nav-count').textContent=n+' items';
}
function openDetail(item){
  selected=item.id;
  const tc=TC[item.type];
  document.getElementById('dp-type').innerHTML=
    `<div style="font-size:5.5px;letter-spacing:2px;color:${tc};margin-bottom:3px;">${item.type.toUpperCase()}</div>
     <div style="font-size:5px;letter-spacing:1px;color:#350808;">#${String(item.id+1).padStart(2,'0')}</div>`;
  document.getElementById('dp-title').style.color=tc;
  document.getElementById('dp-title').textContent=item.title;
  document.getElementById('dp-sub').textContent=item.sub;
  document.getElementById('dp-excerpt').textContent='"'+item.excerpt+'"';
  document.getElementById('dp-tags').innerHTML=
    item.tags.map(t=>`<div style="font-size:5.5px;letter-spacing:1.5px;color:#3a0808;
      border:1px solid #280000;padding:2px 7px;">${t}</div>`).join('');
  document.getElementById('detail-panel').classList.add('on');
}
function closeDetail(){
  selected=-1;
  document.getElementById('detail-panel').classList.remove('on');
}

/* ════════════════════════
   INIT
════════════════════════ */
function init(){
  cvs=document.getElementById('ref-canvas');
  ctx=cvs.getContext('2d');
  resize();
  window.addEventListener('resize',resize);

  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY-30;});
  document.addEventListener('mouseleave',()=>{mx=null;my=null;});

  cvs.addEventListener('click',e=>{
    if(mx===null)return;
    const cx=e.clientX,cy=e.clientY-30;
    const W=cvs.width,H=cvs.height;
    const d=Math.hypot(cx-mx,cy-my);
    if(d>LOUPE_R){closeDetail();return;}
    const rx=mx+(cx-mx)*ZOOM;
    const ry=my+(cy-my)*ZOOM;
    const hit=visibleItems().find(b=>{
      const bx=b.x*W,by=b.y*H;
      return Math.abs(rx-bx)<96&&Math.abs(ry-by)<40;
    });
    if(hit)openDetail(hit);else closeDetail();
  });

  updateCount();
  (function loop(){time+=.011;draw();requestAnimationFrame(loop);})();
}

function resize(){
  cvs.width=window.innerWidth;
  cvs.height=window.innerHeight-30;
}

/* ════════════════════════
   DRAW
════════════════════════ */
function draw(){
  const W=cvs.width,H=cvs.height;
  if(!W||!H)return;

  /* ── 배경 — 짙은 레드블랙 */
  ctx.fillStyle='#030000';ctx.fillRect(0,0,W,H);

  /* ── 세이프라이트 글로우 — 네 모서리 강한 레드 */
  const corners=[[0,0],[W,0],[0,H],[W,H]];
  corners.forEach(([cx2,cy2])=>{
    const g=ctx.createRadialGradient(cx2,cy2,0,cx2,cy2,Math.max(W,H)*.55);
    g.addColorStop(0,'rgba(180,6,0,.28)');
    g.addColorStop(.4,'rgba(120,4,0,.1)');
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  });

  /* ── 중앙 약한 글로우 */
  const cg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.5);
  cg.addColorStop(0,'rgba(60,0,0,.08)');
  cg.addColorStop(1,'transparent');
  ctx.fillStyle=cg;ctx.fillRect(0,0,W,H);

  const vis=visibleItems();

  /* ── 안내 문구 (마우스 없을 때) */
  if(mx===null){
    ctx.save();
    ctx.font='300 14px IBM Plex Mono';
    ctx.fillStyle='rgba(180,10,0,.25)';
    ctx.textAlign='center';
    ctx.fillText('루페를 움직여 현상하세요',W/2,H/2);
    ctx.font='300 7.5px IBM Plex Mono';
    ctx.fillStyle='rgba(150,8,0,.1)';
    ctx.fillText('DARKROOM  ·  MOVE LOUPE TO REVEAL  ·  CLICK TO EXPAND',W/2,H/2+24);
    ctx.restore();
    return;
  }

  const lx=mx,ly=my;

  /* ── 루페 바깥 — 극히 희미한 레드 윤곽 */
  vis.forEach(b=>{
    const bx=b.x*W,by=b.y*H;
    ctx.save();
    ctx.globalAlpha=.05;
    ctx.strokeStyle='#600000';ctx.lineWidth=.5;
    ctx.strokeRect(bx-92,by-37,184,74);
    ctx.restore();
  });

  /* ── 루페 클리핑 */
  ctx.save();
  ctx.beginPath();ctx.arc(lx,ly,LOUPE_R,0,Math.PI*2);ctx.clip();

  /* 루페 내부 배경 — 어두운 레드 현상액 */
  const lbg=ctx.createRadialGradient(lx,ly,0,lx,ly,LOUPE_R);
  lbg.addColorStop(0,'rgba(22,4,2,1)');
  lbg.addColorStop(.7,'rgba(14,2,1,1)');
  lbg.addColorStop(1,'rgba(6,0,0,1)');
  ctx.fillStyle=lbg;ctx.fillRect(lx-LOUPE_R,ly-LOUPE_R,LOUPE_R*2,LOUPE_R*2);

  /* 루페 내부 세이프라이트 앰비언스 */
  const rg=ctx.createRadialGradient(lx,ly,0,lx,ly,LOUPE_R);
  rg.addColorStop(0,'rgba(160,8,0,.1)');
  rg.addColorStop(.6,'rgba(100,4,0,.06)');
  rg.addColorStop(1,'transparent');
  ctx.fillStyle=rg;ctx.fillRect(lx-LOUPE_R,ly-LOUPE_R,LOUPE_R*2,LOUPE_R*2);

  /* 확대 변환 */
  ctx.translate(lx,ly);ctx.scale(ZOOM,ZOOM);ctx.translate(-lx,-ly);

  /* 아이템 렌더 */
  vis.forEach((b,i)=>{
    const bx=b.x*W,by=b.y*H;
    const tc=TC[b.type];
    const fl=.93+Math.sin(time*1.4+i*1.7)*.07;
    const isSel=(b.id===selected);

    ctx.save();
    /* 카드 배경 */
    ctx.globalAlpha=(isSel?.96:.84)*fl;
    ctx.fillStyle=isSel?'#120200':'#0c0100';
    ctx.fillRect(bx-92,by-37,184,74);

    /* 선택 글로우 */
    if(isSel){
      ctx.globalAlpha=.12;
      ctx.fillStyle=tc;
      ctx.fillRect(bx-92,by-37,184,74);
    }

    /* 에지 번 — 인화지 화학 얼룩 */
    const burn=ctx.createRadialGradient(bx,by+37,0,bx,by+37,115);
    burn.addColorStop(0,'transparent');
    burn.addColorStop(1,'rgba(60,0,0,.55)');
    ctx.fillStyle=burn;ctx.fillRect(bx-92,by-37,184,74);

    /* 카드 테두리 */
    ctx.globalAlpha=(isSel?.9:.5)*fl;
    ctx.strokeStyle=tc;
    ctx.lineWidth=(isSel?1.4:.8)/ZOOM;
    ctx.strokeRect(bx-92,by-37,184,74);

    /* TYPE 태그 */
    ctx.globalAlpha=.6*fl;
    ctx.font=`500 ${6/ZOOM*1.5}px IBM Plex Mono`;
    ctx.fillStyle=tc;ctx.textAlign='left';
    ctx.fillText(b.type.toUpperCase(),bx-82,by-23);

    /* 제목 */
    ctx.globalAlpha=fl;
    ctx.font=`${isSel?600:500} ${13/ZOOM*1.5}px IBM Plex Mono`;
    ctx.fillStyle=isSel?tc:'rgba(220,80,60,1)';
    ctx.textAlign='center';ctx.fillText(b.title,bx,by+3);

    /* 저자 */
    ctx.globalAlpha=.62*fl;
    ctx.font=`300 ${7.5/ZOOM*1.5}px IBM Plex Mono`;
    ctx.fillStyle='rgba(140,40,28,1)';
    ctx.fillText(b.sub,bx,by+18);

    /* 발췌 */
    ctx.globalAlpha=.48*fl;
    ctx.font=`300 ${6.5/ZOOM*1.5}px IBM Plex Mono`;
    ctx.fillStyle='rgba(160,60,40,1)';
    const ex=b.excerpt.length>38?b.excerpt.slice(0,38)+'…':b.excerpt;
    ctx.fillText(ex,bx,by+31);

    /* 선택 힌트 */
    if(isSel){
      ctx.globalAlpha=.42;
      ctx.font=`300 ${5.5/ZOOM*1.5}px IBM Plex Mono`;
      ctx.fillStyle=tc;
      ctx.fillText('▼ 하단 패널에서 전체 보기',bx,by+44);
    }
    ctx.restore();
  });

  ctx.restore(); /* 클립 해제 */

  /* ── 루페 링 */
  ctx.save();

  /* 외곽 링 — 레드 */
  ctx.beginPath();ctx.arc(lx,ly,LOUPE_R,0,Math.PI*2);
  ctx.strokeStyle='rgba(200,20,0,.6)';ctx.lineWidth=1.5;ctx.stroke();

  /* 내부 링 */
  ctx.beginPath();ctx.arc(lx,ly,LOUPE_R-4,0,Math.PI*2);
  ctx.strokeStyle='rgba(160,10,0,.15)';ctx.lineWidth=.8;ctx.stroke();

  /* 유리 반사 하이라이트 */
  ctx.beginPath();
  ctx.arc(lx-LOUPE_R*.22,ly-LOUPE_R*.28,LOUPE_R*.17,Math.PI*1.1,Math.PI*1.88);
  ctx.strokeStyle='rgba(255,180,160,.08)';ctx.lineWidth=3;ctx.stroke();

  ctx.restore();

  /* 십자선 */
  ctx.save();
  ctx.strokeStyle='rgba(180,15,0,.15)';ctx.lineWidth=.5;
  ctx.setLineDash([2,7]);
  ctx.beginPath();ctx.moveTo(lx-LOUPE_R+20,ly);ctx.lineTo(lx+LOUPE_R-20,ly);ctx.stroke();
  ctx.beginPath();ctx.moveTo(lx,ly-LOUPE_R+20);ctx.lineTo(lx,ly+LOUPE_R-20);ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

init();
</script>
</body>
</html>
