<script>
const ITEMS=[
  {id:0,type:'book',title:'밝은 방',sub:'Roland Barthes · 1980',
   ex:'punctum — 찌름. studium이 아닌 것, 그것이 나를 쏜다.',tags:['photography','theory']},
  {id:1,type:'book',title:'사진에 관하여',sub:'Susan Sontag · 1977',
   ex:'사진 찍는 행위는 세계를 소유하는 것이다.',tags:['photography','theory']},
  {id:2,type:'book',title:'눈의 문법',sub:'John Szarkowski · 1966',
   ex:'가장자리, 디테일, 평면, 시간, 사물 자체의 것.',tags:['photography']},
  {id:3,type:'book',title:'Ways of Seeing',sub:'John Berger · 1972',
   ex:'보는 방식이 우리가 아는 것보다 먼저다.',tags:['theory']},
  {id:4,type:'book',title:'The Ongoing Moment',sub:'Geoff Dyer · 2005',
   ex:'이미지는 이미지를 낳는다.',tags:['photography']},
  {id:5,type:'book',title:'집합론',sub:'Georg Cantor · 1874',
   ex:'부분이 전체와 같은 크기를 가질 수 있다.',tags:['set·math']},
  {id:6,type:'book',title:'수학의 언어',sub:'Keith Devlin · 1998',
   ex:'수학은 패턴의 과학이다.',tags:['set·math']},
  {id:7,type:'book',title:'On Photography',sub:'Susan Sontag · 1977',
   ex:'카메라는 세계를 해석한다.',tags:['photography','theory']},
  {id:8,type:'idea',title:'선택과 배제',sub:'작업 메모 · 2026',
   ex:'셀렉션은 배제의 행위다. 탈락한 것이 집합을 정의한다.',tags:['photography','set·math']},
  {id:9,type:'idea',title:'프레임의 정치',sub:'작업 메모 · 2025',
   ex:'무엇을 프레임 안에 넣는가는 권력의 문제다.',tags:['photography','theory']},
  {id:10,type:'idea',title:'집합적 셀렉션',sub:'프로젝트 아이디어 · 2026',
   ex:'438장 → 부분집합. 셀렉션 과정을 집합론의 언어로.',tags:['set·math','photography']},
  {id:11,type:'idea',title:'배제의 미학',sub:'메모 · 2026',
   ex:'버린 사진들의 아카이브.',tags:['photography']},
  {id:12,type:'idea',title:'측정과 기록',sub:'작업 방향 · 2026',
   ex:'수치화 실패 자체가 작업이 된다.',tags:['set·math']},
  {id:13,type:'ref',title:'New Topographics',sub:'William Jenkins · 1975',
   ex:'평범한 것의 날카로움.',tags:['photography']},
  {id:14,type:'ref',title:'Bernd & Hilla Becher',sub:'Typologien · 1963–2007',
   ex:'유형학적 반복. 비교를 통해 형태가 드러난다.',tags:['photography']},
  {id:15,type:'ref',title:'August Sander',sub:'Menschen des 20. Jahrhunderts',
   ex:'유형으로서의 초상.',tags:['photography']},
  {id:16,type:'exhibit',title:'한국 현대사진 60년',sub:'국립현대미술관 · 2017',
   ex:'다큐멘터리에서 개념미술까지.',tags:['photography']},
  {id:17,type:'exhibit',title:'The Family of Man',sub:'MoMA · 1955',
   ex:'503점. 인류 보편의 서사.',tags:['photography','theory']},
];

const TC={book:'#ff3820',idea:'#e0304c',ref:'#ff7030',exhibit:'#d0a040'};

// 공간 비율
const CY_R=0.61; // 카운터 상단 y
const LY_R=0.27; // 건조선 y

// 타입별 x 배치
const PX={
  book:   [.05,.16,.27,.38,.50,.62,.73,.85],
  exhibit:[.22,.70],
  idea:   [.07,.17,.27,.37,.47],
  ref:    [.63,.74,.85],
};

let cvs,ctx,t=0,mx=null,my=null,flt='all',sel=-1;
const LR=145, ZM=1.9;

function vis(){return flt==='all'?ITEMS:ITEMS.filter(b=>b.type===flt);}

function gp(item,W,H){
  const idx=ITEMS.filter(b=>b.type===item.type).indexOf(item);
  const x=(PX[item.type][idx]||.5)*W;
  const CY=H*CY_R, LY=H*LY_R;
  const y=item.type==='book'   ? LY+56
          :item.type==='exhibit'? H*.14
          : CY+8;
  return{x,y};
}

// ─── 방 구조 ───
function room(W,H,a){
  const CY=H*CY_R, LY=H*LY_R;

  // 벽
  const wg=ctx.createLinearGradient(0,0,0,CY);
  wg.addColorStop(0,`rgba(5,0,0,${a})`);
  wg.addColorStop(1,`rgba(8,0,0,${a})`);
  ctx.fillStyle=wg; ctx.fillRect(0,0,W,CY);

  // 벽 수평 질감
  ctx.fillStyle=`rgba(20,0,0,${a*.3})`;
  for(let y=0;y<CY;y+=10) ctx.fillRect(0,y,W,.4);

  // 카운터 상단
  const cg=ctx.createLinearGradient(0,CY,0,CY+22);
  cg.addColorStop(0,`rgba(22,2,0,${a*2})`);
  cg.addColorStop(1,`rgba(12,1,0,${a*2})`);
  ctx.fillStyle=cg; ctx.fillRect(0,CY,W,22);
  ctx.strokeStyle=`rgba(150,8,0,${a*3})`; ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,CY);ctx.lineTo(W,CY);ctx.stroke();
  ctx.strokeStyle=`rgba(0,0,0,${a*4})`;
  ctx.beginPath();ctx.moveTo(0,CY+22);ctx.lineTo(W,CY+22);ctx.stroke();

  // 바닥
  ctx.fillStyle=`rgba(4,0,0,${a})`; ctx.fillRect(0,CY+22,W,H-CY-22);
  // 바닥 원근선
  const fp=CY+22; ctx.strokeStyle=`rgba(55,0,0,${a*.9})`; ctx.lineWidth=.4;
  for(let i=0;i<=14;i++){
    const fx=(i/14)*W;
    ctx.beginPath();ctx.moveTo(W/2+(fx-W/2)*.1,fp);ctx.lineTo(fx,H);ctx.stroke();
  }
  for(let fy=fp,n=6,i=0;i<n;i++){
    const y=fp+(H-fp)*i/n;
    ctx.globalAlpha=(i/n)*a*.12;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  ctx.globalAlpha=1;

  // 건조선
  ctx.strokeStyle=`rgba(110,8,0,${a*2.2})`; ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W*.02,LY);ctx.lineTo(W*.98,LY);ctx.stroke();
  [W*.02,W*.98].forEach(ax=>{
    ctx.fillStyle=`rgba(130,12,0,${a*3})`;
    ctx.beginPath();ctx.arc(ax,LY,4,0,Math.PI*2);ctx.fill();
  });

  // 현상 트레이
  const ty=CY+3, th=16;
  // DEVELOPER (왼쪽 — 아이디어 구역)
  ctx.fillStyle=`rgba(14,1,0,${a*2.5})`; ctx.fillRect(W*.03,ty,W*.46,th);
  ctx.strokeStyle=`rgba(90,5,0,${a*3.5})`; ctx.lineWidth=.5;
  ctx.strokeRect(W*.03,ty,W*.46,th);
  const dg=ctx.createLinearGradient(W*.03,ty,W*.49,ty);
  dg.addColorStop(0,`rgba(35,2,0,${a*3})`);dg.addColorStop(.5,`rgba(45,3,0,${a*3})`);dg.addColorStop(1,`rgba(28,1,0,${a*3})`);
  ctx.fillStyle=dg; ctx.fillRect(W*.03,ty,W*.46,3);

  // STOP (가운데 — 작은 구분)
  ctx.fillStyle=`rgba(14,1,0,${a*2.5})`; ctx.fillRect(W*.51,ty,W*.07,th);
  ctx.strokeStyle=`rgba(90,5,0,${a*3.5})`; ctx.strokeRect(W*.51,ty,W*.07,th);

  // FIXER (오른쪽 — ref 구역)
  ctx.fillStyle=`rgba(14,1,0,${a*2.5})`; ctx.fillRect(W*.60,ty,W*.32,th);
  ctx.strokeStyle=`rgba(90,5,0,${a*3.5})`; ctx.strokeRect(W*.60,ty,W*.32,th);
  const fg=ctx.createLinearGradient(W*.60,ty,W*.92,ty);
  fg.addColorStop(0,`rgba(28,2,0,${a*3})`);fg.addColorStop(.5,`rgba(40,3,0,${a*3})`);fg.addColorStop(1,`rgba(22,1,0,${a*3})`);
  ctx.fillStyle=fg; ctx.fillRect(W*.60,ty,W*.32,3);

  // 트레이 라벨
  ctx.font='300 5px IBM Plex Mono'; ctx.textAlign='center';
  ctx.fillStyle=`rgba(90,8,0,${a*3.5})`;
  ctx.fillText('DEVELOPER',W*.26,CY+32);
  ctx.fillText('STOP',W*.545,CY+32);
  ctx.fillText('FIXER',W*.76,CY+32);

  // 세이프라이트 램프
  const slX=W*.5;
  ctx.strokeStyle=`rgba(60,4,0,${a*4})`; ctx.lineWidth=.6;
  ctx.beginPath();ctx.moveTo(slX,0);ctx.lineTo(slX,13);ctx.stroke();
  ctx.fillStyle=`rgba(28,2,0,${a*6})`; ctx.fillRect(slX-22,13,44,12);
  ctx.strokeStyle=`rgba(100,8,0,${a*6})`; ctx.lineWidth=.5;
  ctx.strokeRect(slX-22,13,44,12);
  // 램프 소자
  ctx.fillStyle=`rgba(200,10,0,${a*8})`;
  ctx.beginPath();ctx.ellipse(slX,19,11,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=`rgba(255,60,20,${a*7})`;
  ctx.beginPath();ctx.ellipse(slX,19,5,2,0,0,Math.PI*2);ctx.fill();

  // 타이머 (카운터 오른쪽 끝 디테일)
  ctx.strokeStyle=`rgba(70,5,0,${a*2.5})`; ctx.lineWidth=.5;
  ctx.beginPath();ctx.arc(W*.95,CY+10,8,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W*.95,CY+10);ctx.lineTo(W*.95,CY+4);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W*.95,CY+10);ctx.lineTo(W*.95+4,CY+10);ctx.stroke();
}

// ─── 세이프라이트 빛 원뿔 ───
function cone(W,H,a){
  const slX=W*.5, slY=19;
  const g=ctx.createRadialGradient(slX,slY,0,slX,slY,W*.7);
  g.addColorStop(0,`rgba(170,6,0,${a*.32})`);
  g.addColorStop(.22,`rgba(130,4,0,${a*.18})`);
  g.addColorStop(.52,`rgba(80,2,0,${a*.08})`);
  g.addColorStop(1,'transparent');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H*CY_R+10);

  // 코너 앰비언스
  [[0,0],[W,0]].forEach(([cx,cy])=>{
    const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,W*.4);
    cg.addColorStop(0,`rgba(100,4,0,${a*.1})`);cg.addColorStop(1,'transparent');
    ctx.fillStyle=cg; ctx.fillRect(0,0,W,H);
  });
}

// ─── 아이템 희미한 윤곽 (루페 밖) ───
function dimItem(item,pos){
  const{x,y}=pos;
  const tc=TC[item.type];
  ctx.save();
  if(item.type==='book'){
    // 건조선 → 핀치 → 얇은 카드
    ctx.globalAlpha=.09;
    ctx.strokeStyle='rgba(120,8,0,1)'; ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,y-57);ctx.lineTo(x,y+25);ctx.stroke();
    ctx.strokeStyle=tc; ctx.lineWidth=.4;
    ctx.strokeRect(x-24,y-24,48,50);
  } else if(item.type==='exhibit'){
    ctx.globalAlpha=.07;
    ctx.fillStyle='rgba(150,10,0,.8)';
    ctx.beginPath();ctx.arc(x,y-32,2.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=tc; ctx.lineWidth=.4;
    ctx.strokeRect(x-28,y-30,56,60);
  } else {
    // 트레이 안 — 거의 안 보임
    ctx.globalAlpha=.06;
    ctx.strokeStyle=tc; ctx.lineWidth=.4;
    ctx.strokeRect(x-26,y-6,52,13);
  }
  ctx.restore();
}

// ─── 아이템 전체 디테일 (루페 안) ───
function fullItem(item,pos,W,H){
  const{x,y}=pos;
  const tc=TC[item.type];
  const LY=H*LY_R;
  const fl=.94+Math.sin(t*1.4+item.id*1.7)*.06;
  const isSel=item.id===sel;
  const Z=ZM;
  ctx.save();

  if(item.type==='book'){
    // 나무 집게
    ctx.fillStyle='#3d1200'; ctx.fillRect(x-3/Z,LY-1/Z,6/Z,20/Z);
    ctx.fillStyle='#5c1a00';
    ctx.beginPath();ctx.ellipse(x,LY+4/Z,7/Z,5/Z,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#8a2800'; ctx.lineWidth=.5/Z; ctx.stroke();
  }
  if(item.type==='exhibit'){
    // 압정
    ctx.fillStyle='#900000';
    ctx.beginPath();ctx.arc(x,y-42,4/Z,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#cc1000';
    ctx.beginPath();ctx.arc(x,y-42,2/Z,0,Math.PI*2);ctx.fill();
  }

  // 카드 배경
  ctx.globalAlpha=(isSel?.96:.84)*fl;
  ctx.fillStyle=isSel?'#130100':'#0d0100';
  ctx.fillRect(x-92,y-37,184,74);
  if(isSel){ctx.globalAlpha=.11;ctx.fillStyle=tc;ctx.fillRect(x-92,y-37,184,74);}

  // 번 효과
  const bn=ctx.createRadialGradient(x,y+37,0,x,y+37,118);
  bn.addColorStop(0,'transparent');bn.addColorStop(1,'rgba(50,0,0,.55)');
  ctx.fillStyle=bn; ctx.fillRect(x-92,y-37,184,74);

  // 테두리
  ctx.globalAlpha=(isSel?.9:.5)*fl;
  ctx.strokeStyle=tc; ctx.lineWidth=(isSel?1.4:.8)/Z;
  ctx.strokeRect(x-92,y-37,184,74);

  // TYPE
  ctx.globalAlpha=.58*fl;
  ctx.font=`500 ${6/Z*1.5}px IBM Plex Mono`;
  ctx.fillStyle=tc; ctx.textAlign='left';
  ctx.fillText(item.type.toUpperCase(),x-82,y-23);

  // 제목
  ctx.globalAlpha=fl;
  ctx.font=`${isSel?600:500} ${13/Z*1.5}px IBM Plex Mono`;
  ctx.fillStyle=isSel?tc:'rgba(210,65,45,1)';
  ctx.textAlign='center'; ctx.fillText(item.title,x,y+3);

  // 저자
  ctx.globalAlpha=.6*fl;
  ctx.font=`300 ${7.5/Z*1.5}px IBM Plex Mono`;
  ctx.fillStyle='rgba(128,28,16,1)';
  ctx.fillText(item.sub,x,y+18);

  // 발췌
  ctx.globalAlpha=.44*fl;
  ctx.font=`300 ${6.5/Z*1.5}px IBM Plex Mono`;
  ctx.fillStyle='rgba(145,48,28,1)';
  const ex=item.ex.length>36?item.ex.slice(0,36)+'…':item.ex;
  ctx.fillText(ex,x,y+31);

  if(isSel){
    ctx.globalAlpha=.38;
    ctx.font=`300 ${5.5/Z*1.5}px IBM Plex Mono`;
    ctx.fillStyle=tc;
    ctx.fillText('▼ 하단에서 전체 보기',x,y+45);
  }
  ctx.restore();
}

// ─── 루페 링 ───
function loupeRing(lx,ly){
  ctx.save();
  ctx.beginPath();ctx.arc(lx,ly,LR,0,Math.PI*2);
  ctx.strokeStyle='rgba(200,16,0,.56)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.beginPath();ctx.arc(lx,ly,LR-4,0,Math.PI*2);
  ctx.strokeStyle='rgba(160,8,0,.12)'; ctx.lineWidth=.8; ctx.stroke();
  ctx.beginPath();
  ctx.arc(lx-LR*.2,ly-LR*.27,LR*.16,Math.PI*1.1,Math.PI*1.87);
  ctx.strokeStyle='rgba(255,150,130,.07)'; ctx.lineWidth=3; ctx.stroke();
  ctx.strokeStyle='rgba(180,10,0,.12)'; ctx.lineWidth=.5;
  ctx.setLineDash([2,7]);
  ctx.beginPath();ctx.moveTo(lx-LR+20,ly);ctx.lineTo(lx+LR-20,ly);ctx.stroke();
  ctx.beginPath();ctx.moveTo(lx,ly-LR+20);ctx.lineTo(lx,ly+LR-20);ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

// ─── 메인 드로우 ───
function draw(){
  const W=cvs.width,H=cvs.height;
  if(!W||!H)return;

  ctx.fillStyle='#030000'; ctx.fillRect(0,0,W,H);

  // 방 구조 (희미하게 — 항상 보임)
  room(W,H,.13);
  // 세이프라이트 원뿔
  cone(W,H,1);

  const items=vis();
  // 아이템 실루엣
  items.forEach(b=>dimItem(b,gp(b,W,H)));

  if(mx===null){
    ctx.font='300 13px IBM Plex Mono';
    ctx.fillStyle='rgba(180,10,0,.2)';
    ctx.textAlign='center';
    ctx.fillText('루페를 움직여 현상하세요',W/2,H/2);
    ctx.font='300 7.5px IBM Plex Mono';
    ctx.fillStyle='rgba(140,6,0,.08)';
    ctx.fillText('DARKROOM  ·  MOVE LOUPE TO REVEAL  ·  CLICK TO EXPAND',W/2,H/2+22);
    return;
  }

  const lx=mx,ly=my;

  // ── 루페 ──
  ctx.save();
  ctx.beginPath();ctx.arc(lx,ly,LR,0,Math.PI*2);ctx.clip();

  // 루페 내부 배경
  const bg=ctx.createRadialGradient(lx,ly,0,lx,ly,LR);
  bg.addColorStop(0,'rgba(20,2,1,1)');
  bg.addColorStop(.8,'rgba(11,1,0,1)');
  bg.addColorStop(1,'rgba(5,0,0,1)');
  ctx.fillStyle=bg; ctx.fillRect(lx-LR,ly-LR,LR*2,LR*2);

  // 루페 안 방 구조 (더 선명하게)
  room(W,H,.42);
  cone(W,H,.85);

  // 확대 변환
  ctx.translate(lx,ly);ctx.scale(ZM,ZM);ctx.translate(-lx,-ly);

  // 아이템 전체 디테일
  items.forEach(b=>fullItem(b,gp(b,W,H),W,H));

  ctx.restore();

  // 루페 링
  loupeRing(lx,ly);
}

// ─── UI ───
function setF(f,el){
  flt=f;sel=-1;closeD();
  document.querySelectorAll('.nav-f').forEach(e=>e.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('nn').textContent=vis().length+' items';
}
function openD(item){
  sel=item.id;
  const tc=TC[item.type];
  document.getElementById('dp-type').innerHTML=
    `<div style="font-size:5.5px;letter-spacing:2px;color:${tc};margin-bottom:3px">${item.type.toUpperCase()}</div>
     <div style="font-size:5px;letter-spacing:1px;color:#300000">#${String(item.id+1).padStart(2,'0')}</div>`;
  document.getElementById('dp-title').style.color=tc;
  document.getElementById('dp-title').textContent=item.title;
  document.getElementById('dp-sub').textContent=item.sub;
  document.getElementById('dp-ex').textContent='"'+item.ex+'"';
  document.getElementById('dp-tags').innerHTML=
    item.tags.map(g=>`<div style="font-size:5.5px;letter-spacing:1.5px;color:#380808;border:1px solid #260000;padding:2px 7px">${g}</div>`).join('');
  document.getElementById('dp').classList.add('on');
}
function closeD(){
  sel=-1;
  document.getElementById('dp').classList.remove('on');
}

// ─── INIT ───
function init(){
  cvs=document.getElementById('cv');
  ctx=cvs.getContext('2d');
  cvs.width=window.innerWidth; cvs.height=window.innerHeight-30;
  window.addEventListener('resize',()=>{
    cvs.width=window.innerWidth;cvs.height=window.innerHeight-30;
  });
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY-30;});
  document.addEventListener('mouseleave',()=>{mx=null;my=null;});
  cvs.addEventListener('click',e=>{
    if(mx===null)return;
    const cx=e.clientX,cy=e.clientY-30,W=cvs.width,H=cvs.height;
    if(Math.hypot(cx-mx,cy-my)>LR){closeD();return;}
    const rx=mx+(cx-mx)*ZM, ry=my+(cy-my)*ZM;
    const hit=vis().find(b=>{const p=gp(b,W,H);return Math.abs(rx-p.x)<92&&Math.abs(ry-p.y)<38;});
    if(hit)openD(hit);else closeD();
  });
  document.getElementById('nn').textContent=ITEMS.length+' items';
  (function loop(){t+=.011;draw();requestAnimationFrame(loop);})();
}
init();
</script>
